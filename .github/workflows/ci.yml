name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # TextDecoder needs a full-icu build for Shift_JIS / EUC-JP
          # (every official build qualifies)
          node-version: '22'

      - name: manifest の JSON を検証
        run: |
          for f in manifest.json _locales/*/messages.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1
            echo "ok $f"
          done

      # Detection only uses browser APIs, so Node can verify it as is
      - name: 判定ロジックのテスト
        run: node --test test/*.test.js

      - name: 配布用 zip が作れることを確認
        run: ./package.sh
